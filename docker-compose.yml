# SplunkHarbor - Splunk receiver in Docker (alternative to the install script)
services:
  splunk:
    image: splunk/splunk:9.4
    container_name: splunkharbor-splunk
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_PASSWORD: "${LH_PASSWORD:-changeme123}"
      SPLUNK_APPS_URL: ""
    ports:
      - "8000:8000"
      - "9997:9997"
    volumes:
      - ./configs/splunkharbor/local/inputs.conf:/opt/splunk/etc/apps/splunkharbor_receiver/local/inputs.conf:ro
      - splunk-etc:/opt/splunk/etc
      - splunk-var:/opt/splunk/var
volumes:
  splunk-etc:
  splunk-var:
