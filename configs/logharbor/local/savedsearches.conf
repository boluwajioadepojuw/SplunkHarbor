# ============================================================================
# savedsearches.conf — the five LH detections as saved searches
#
# Deploy to: $SPLUNK_HOME/etc/apps/splunkharbor_receiver/local/
# (the Docker compose stack mounts this directory, so the searches appear
# on first boot; on the bare-metal install, configure-inputs.sh copies them)
#
# All five run every 5 minutes and track alert state. The brute-force
# search also fires a webhook so the alert-to-response loop can be wired
# to a ticket system or a chat channel: replace the placeholder URL with
# your receiver.
# ============================================================================

[LH - Brute Force Detection]
search = index=wineventlog sourcetype="*WinEventLog:Security" EventCode=4625 | eval src_ip = coalesce(src_ip, IpAddress, "unknown") | bin _time span=5m | stats count by _time, src_ip | where count > 5 | sort - count
cron_schedule = */5 * * * *
description = Failed logons (4625) clustered per source over 5 minutes
dispatch.earliest_time = -6m
dispatch.latest_time = now
alert.track = 1
alert.severity = 3
action.webhook = 1
action.webhook.param.url = https://example.invalid/lh-alerts
disabled = 0

[LH - Encoded PowerShell]
search = index=sysmon sourcetype="*WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 CommandLine IN ("*EncodedCommand*", "*-enc*", "*-e *") | table _time, host, Image, ParentImage, CommandLine
cron_schedule = */5 * * * *
description = Encoded PowerShell command lines from Sysmon process creation
dispatch.earliest_time = -6m
dispatch.latest_time = now
alert.track = 1
alert.severity = 3
disabled = 0

[LH - Lateral Movement]
search = index=wineventlog sourcetype="*WinEventLog:Security" EventCode=5140 | eval src_ip = coalesce(src_ip, IpAddress, "unknown") | eval user = coalesce(user, SubjectUserName, "unknown") | stats count by _time, src_ip, user, ShareName | sort - count
cron_schedule = */5 * * * *
description = Network share access (5140) clustered per source and share
dispatch.earliest_time = -6m
dispatch.latest_time = now
alert.track = 1
alert.severity = 3
disabled = 0

[LH - Persistence]
search = index=sysmon sourcetype="*WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=13 TargetObject IN ("*CurrentVersion\Run*", "*Startup*") | table _time, host, Image, TargetObject, Details
cron_schedule = */5 * * * *
description = Registry Run key and startup folder writes (Sysmon 13)
dispatch.earliest_time = -6m
dispatch.latest_time = now
alert.track = 1
alert.severity = 3
disabled = 0

[LH - Scheduled Tasks]
search = index=sysmon sourcetype="*WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 Image="*schtasks.exe" CommandLine="*/create*" | table _time, host, User, ParentImage, CommandLine
cron_schedule = */5 * * * *
description = schtasks /create executions from Sysmon process creation
dispatch.earliest_time = -6m
dispatch.latest_time = now
alert.track = 1
alert.severity = 3
disabled = 0
